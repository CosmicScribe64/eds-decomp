# Match gate + objdiff progress report, on every push and pull request.
# No ROM is needed anywhere in CI: every check compares compiled C against the original assembly
# committed under asm/ (tools/target.py), never against the game itself.
# decomp.dev reads the uploaded "AY5E_report" artifact from the default branch.
name: Progress report

on:
  push:
  pull_request:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # publish the progress badges to the `badges` branch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build toolchain image
        run: docker build -t eds-decomp docker/

      # The gate: every C unit (and authored assembly unit) must still match its original bytes.
      - name: Every unit matches its original assembly
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/work -w /work eds-decomp \
            python3 tools/check_all.py -j "$(nproc)"

      # A pull request may not turn matching C back into assembly fallbacks.
      - name: Progress does not go backwards
        if: github.event_name == 'pull_request'
        run: |
          count() { python3 tools/progress.py | sed -n 's/^Decompiled: \([0-9]*\)\/.*/\1/p'; }
          head=$(count)
          git worktree add -q /tmp/base "${{ github.event.pull_request.base.sha }}"
          base=$(cd /tmp/base && count)
          echo "functions in matching source: base $base, this PR $head"
          [ "$head" -ge "$base" ]

      - name: Generate objdiff report
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/work -w /work eds-decomp \
            make -j"$(nproc)" objdiff-report

      - name: Check report
        run: python3 tools/check_report.py build/report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: AY5E_report
          path: build/report.json

      # README badges: shields.io reads code.json and functions.json from the `badges` branch.
      - name: Publish progress badges
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 tools/badges.py /tmp/badges
          cd /tmp/badges
          git init -q -b badges
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update progress badges"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" badges
